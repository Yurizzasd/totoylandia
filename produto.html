<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livrinho — ToToyLandia</title>
  <meta name="description" content="Livrinho de colorir em PDF da ToToyLandia — entrega imediata por e-mail após o pagamento seguro via Kiwify.">
  <meta property="og:title" content="ToToyLandia — Livrinho de colorir em PDF">
  <meta property="og:image" content="https://totoylandia.yuricruzcorreia2024.workers.dev/assets/og-card-1200x630.png">
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="ttl-pular-conteudo" href="#ttl-conteudo">Pular para o conteúdo</a>

  <header id="ttl-header" data-pagina="catalogo"></header>

  <main id="ttl-conteudo" class="ttl-produto-main">
    <div id="ttl-produto"></div>

    <!-- Prévias internas (aparece só quando o cadastro tem imagens reais) -->
    <section class="ttl-previas" id="ttl-previas" hidden aria-labelledby="titulo-previas">
      <h2 id="titulo-previas">Demonstração do livrinho — páginas por dentro</h2>
      <div class="ttl-previas-grade"></div>
    </section>

    <!-- Relacionados (mesma categoria, quando existem) -->
    <section class="ttl-secao" id="ttl-relacionados" hidden aria-labelledby="titulo-relacionados">
      <div class="ttl-secao-cabecalho">
        <h2 class="ttl-secao-titulo" id="titulo-relacionados"><span class="ttl-secao-estrelinha ttl-ico" data-ico="estrela" data-ico-tamanho="22" aria-hidden="true"></span> Livrinhos do mesmo mundo</h2>
        <a class="ttl-secao-ver-tudo" href="catalogo.html">Ver todos
          <span class="ttl-ico" data-ico="setaDireita" data-ico-tamanho="15" aria-hidden="true"></span>
        </a>
      </div>
      <div class="ttl-grade-vitrine"></div>
    </section>
  </main>

  <footer id="ttl-footer"></footer>

  <!-- Lightbox para ampliar capa e páginas internas -->
  <dialog class="ttl-lightbox" id="ttl-lightbox" aria-label="Imagem ampliada">
    <div class="ttl-lightbox-conteudo">
      <button class="ttl-lightbox-fechar" type="button" aria-label="Fechar imagem ampliada">
        <span class="ttl-ico" data-ico="fechar" data-ico-tamanho="26" aria-hidden="true"></span>
      </button>
      <img src="" alt="">
      <p class="ttl-lightbox-legenda"></p>
    </div>
  </dialog>

  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/produto.js"></script>
</body>
</html>
