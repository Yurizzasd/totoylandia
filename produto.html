<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livrinho — ToToyLandia</title>
  <meta name="description" content="Livrinho de colorir em PDF da ToToyLandia — entrega imediata por e-mail após o pagamento seguro via Kiwify.">
  <meta property="og:title" content="ToToyLandia — Livrinho de colorir em PDF">
  <meta property="og:image" content="assets/og-logo.png">
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="ttl-pular-conteudo" href="#ttl-conteudo">Pular para o conteúdo</a>

  <header id="ttl-header" data-pagina="catalogo"></header>

  <main id="ttl-conteudo" class="ttl-produto-main">
    <div id="ttl-produto"></div>

    <!-- Prévias internas (aparece só quando o cadastro tem imagens reais) -->
    <section class="ttl-previas" id="ttl-previas" hidden aria-labelledby="titulo-previas">
      <h2 id="titulo-previas">Demonstração do livrinho — páginas por dentro</h2>
      <div class="ttl-previas-grade"></div>
    </section>

    <!-- Relacionados (mesma categoria, quando existem) -->
    <section class="ttl-secao" id="ttl-relacionados" hidden aria-labelledby="titulo-relacionados">
      <div class="ttl-secao-cabecalho">
        <h2 class="ttl-secao-titulo" id="titulo-relacionados"><span class="ttl-secao-estrelinha" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg></span> Livrinhos do mesmo mundo</h2>
        <a class="ttl-secao-ver-tudo" href="catalogo.html">Ver todos
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
      </div>
      <div class="ttl-grade-vitrine"></div>
    </section>
  </main>

  <footer id="ttl-footer"></footer>

  <!-- Lightbox para ampliar capa e páginas internas -->
  <dialog class="ttl-lightbox" id="ttl-lightbox" aria-label="Imagem ampliada">
    <div class="ttl-lightbox-conteudo">
      <button class="ttl-lightbox-fechar" type="button" aria-label="Fechar imagem ampliada">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </button>
      <img src="" alt="">
      <p class="ttl-lightbox-legenda"></p>
    </div>
  </dialog>

  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/produto.js"></script>
</body>
</html>
