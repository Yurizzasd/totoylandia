<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todos os livrinhos — ToToyLandia</title>
  <meta name="description" content="Catálogo completo de livros de colorir em PDF da ToToyLandia: animais, dinossauros, princesas, carros, espaço e muito mais. Entrega por e-mail.">
  <link rel="icon" type="image/jpeg" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="ttl-bg-pontinhos" aria-hidden="true"></div>

  <header id="ttl-header"></header>

  <main>
    <section class="ttl-secao" style="padding-bottom: 0;">
      <h1 style="font-size: clamp(1.8rem, 4vw, 2.4rem)">Todos os livrinhos</h1>
      <p style="color: var(--ttl-ink-suave); margin-top: 0.3rem;">Escolha por tema, pesquise pelo nome e leve para casa aquele que combina com a sua criançada.</p>
    </section>

    <!-- ===== Controles: busca + ordenação ===== -->
    <section class="ttl-catalogo-controles" aria-label="Filtros do catálogo">
      <div class="ttl-busca-area">
        <form role="search" onsubmit="return false;">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M21 21l-4.3-4.3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          <label class="sr-unica" hidden for="ttl-busca">Pesquisar</label>
          <input type="search" id="ttl-busca" placeholder="Pesquisar: dinossauro, fofinho, arco-íris…" autocomplete="off">
        </form>
        <div class="ttl-ordenacao">
          <label for="ttl-ordenacao">Ordenar por</label>
          <select id="ttl-ordenacao">
            <option value="relevancia">Nossa escolha</option>
            <option value="populares">Mais vendidos</option>
            <option value="preco-asc">Menor preço</option>
            <option value="preco-desc">Maior preço</option>
          </select>
        </div>
      </div>

      <!-- ===== Chips de categoria ===== -->
      <div class="ttl-chips" id="ttl-chips-categorias" role="group" aria-label="Filtrar por categoria"></div>
    </section>

    <!-- ===== Grade do catálogo ===== -->
    <section class="ttl-catalogo-corpo">
      <div class="ttl-catalogo-cabecalho">
        <span id="ttl-contador-resultados" aria-live="polite"></span>
      </div>

      <div class="ttl-catalogo-grade" id="ttl-catalogo-grade"></div>

      <div class="ttl-sem-resultados" id="ttl-sem-resultados" hidden>
        <img src="assets/logo.png" alt="" width="96" loading="lazy">
        <h3>Ops, nada por aqui</h3>
        <p>Nenhum livrinho encontrado com esses filtros. Tente outra palavra ou limpe a pesquisa.</p>
        <p class="ttl-botao-limpar" style="margin-top: 1rem;">
          <a class="ttl-btn ttl-btn-secundario" href="catalogo.html">Limpar filtros</a>
        </p>
      </div>

      <div class="ttl-carregar-mais-area">
        <button class="ttl-btn ttl-btn-secundario" id="ttl-carregar-mais">Mostrar mais livrinhos</button>
      </div>
    </section>
  </main>

  <footer id="ttl-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script>
    TTLUI.montarHeader('catalogo');
    TTLUI.montarFooter();
    TTLUI.atualizarBadge();
  </script>
  <script src="js/catalogo.js"></script>
</body>
</html>
