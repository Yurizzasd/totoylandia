<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todos os livrinhos — ToToyLandia</title>
  <meta name="description" content="Catálogo de livrinhos de colorir em PDF da ToToyLandia: animais, dinossauros, princesas, carros, espaço e muito mais. Entrega imediata por e-mail.">
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="ttl-pular-conteudo" href="#ttl-conteudo">Pular para o conteúdo</a>

  <header id="ttl-header" data-pagina="catalogo"></header>

  <main id="ttl-conteudo">
    <section class="ttl-secao" style="padding-bottom: 0;">
      <h1 style="font-size: clamp(1.7rem, 3.6vw, 2.2rem)">Todos os livrinhos</h1>
      <p class="ttl-secao-intro" style="margin-top: 0.3rem; margin-bottom: 0;">Escolha por tema, pesquise pelo nome e leve para casa aquele que combina com a sua criançada.</p>
    </section>

    <!-- ===== Controles: busca + ordenação ===== -->
    <section class="ttl-catalogo-controles" aria-label="Filtros do catálogo">
      <div class="ttl-busca-area">
        <form role="search" onsubmit="return false;">
          <span class="ttl-ico" data-ico="busca" data-ico-tamanho="24" aria-hidden="true"></span>
          <label class="sr-unica" for="ttl-busca">Pesquisar livrinhos</label>
          <input type="search" id="ttl-busca" placeholder="Pesquisar: dinossauro, fofinho, arco-íris…" autocomplete="off">
          <button type="button" class="ttl-busca-limpar" id="ttl-busca-limpar" aria-label="Limpar pesquisa">
            <span class="ttl-ico" data-ico="fechar" data-ico-tamanho="20" aria-hidden="true"></span>
          </button>
        </form>
        <div class="ttl-ordenacao">
          <label for="ttl-ordenacao">Ordenar por</label>
          <select id="ttl-ordenacao">
            <option value="relevancia">Nossa escolha</option>
            <option value="populares">Mais vendidos</option>
            <option value="preco-asc">Menor preço</option>
            <option value="preco-desc">Maior preço</option>
          </select>
        </div>
      </div>

      <!-- ===== Chips de categoria ===== -->
      <div class="ttl-chips" id="ttl-chips-categorias" role="group" aria-label="Filtrar por categoria"></div>
    </section>

    <!-- ===== Grade do catálogo ===== -->
    <section class="ttl-catalogo-corpo">
      <div class="ttl-catalogo-cabecalho">
        <span id="ttl-contador-resultados" aria-live="polite"></span>
      </div>

      <div class="ttl-catalogo-grade" id="ttl-catalogo-grade"></div>

      <div class="ttl-sem-resultados" id="ttl-sem-resultados" hidden>
        <span class="ttl-ico" data-ico="lupaCartoon" data-ico-tamanho="72" aria-hidden="true"></span>
        <h3>Ops, nada por aqui</h3>
        <p>Nenhum livrinho encontrado com esses filtros. Tente outra palavra ou limpe a pesquisa.</p>
        <p style="margin-top: 1rem;">
          <a class="ttl-btn ttl-btn-secundario" href="catalogo.html">Limpar filtros</a>
        </p>
      </div>

      <div class="ttl-carregar-mais-area">
        <button class="ttl-btn ttl-btn-secundario" id="ttl-carregar-mais" hidden>
          <span class="ttl-ico" data-ico="chevronAbaixoPng" data-ico-tamanho="22" aria-hidden="true"></span>
          Mostrar mais livrinhos
        </button>
      </div>
    </section>
  </main>

  <footer id="ttl-footer"></footer>

  <noscript>
    <p style="max-width: 720px; margin: 1rem auto; padding: 1rem; background: #fff; border-radius: 12px; text-align: center;">
      Para ver o catálogo de livrinhos, ative o JavaScript no navegador.
    </p>
  </noscript>

  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/catalogo.js"></script>
</body>
</html>
